name: Generate Snake

on:
  schedule:
    # Run once every 24 hours
    - cron: "0 0 * * *"
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:
  # Also run on push to main branch to initialize immediately
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Generates the snake game grid SVGs
      - name: Generate github-snake-dark.svg
        uses: Platane/snk@v3
        with:
          github_user_name: SercanOzkan55
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Push the generated SVGs to the 'output' branch
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
